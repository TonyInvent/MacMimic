[build-system]
requires = ["uv_build>=0.8.19,<0.10.0"]
build-backend = "uv_build"

[project]
name = "supermimic-mlx"
version = "0.1.0"
description = "SuperMimic and BlinkMimic (G1 whole-body motion tracking with a differentiable world model) on Apple silicon: MLX + CPU MuJoCo."
license = "MIT"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "mlx>=0.29",
  "mujoco>=3.3.0",
  "numpy>=1.26",
  "matplotlib",
]

[project.optional-dependencies]
superdex = [
    "superdex-physics>=1.0.1",
    "superdex-robotics>=1.0.1",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
